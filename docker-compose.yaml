services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: adora
    ports:
      - 5432:5432

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - 8080:3000
    environment:
      DB_DSN: postgres://postgres:postgres@postgres:5432/adora?sslmode=disable
