all: false
dir: '{{.InterfaceDir}}/mocking'
filename: '{{.InterfaceName}}.go'
force-file-write: true
formatter: goimports
formatter-options:
  goimports:
    all-errors: false
    comments: true
    format-only: true
    fragment: false
    local-prefix: ""
    tab-indent: true
    tab-width: 8
generate: true
include-auto-generated: false
log-level: info
structname: '{{.InterfaceName}}'
pkgname: mocking
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  adora-test/internal/service:
    config:
      all: true
  adora-test/internal/data:
    config:
      all: true
